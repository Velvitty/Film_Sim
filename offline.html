    &lt;style&gt;
        /* ============================================================================
           Film Filter Studio — 라이트 글래스모피즘 UI
           ----------------------------------------------------------------------------
           설계 방침
             · 모바일 퍼스트: 기본 스타일이 폰 기준, 미디어 쿼리로 넓은 화면을 덧씌운다
             · 밝은 메시 그라데이션 배경 위에 반투명 유리 카드(backdrop-filter)를 띄운다
             · 터치 타겟 최소 48px, 폰에서는 미리보기가 상단 고정 + 실행 버튼이 하단 고정
             · 노치/홈 인디케이터 대응(safe-area-inset)
           ========================================================================== */

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;               /* 브라우저 기본 위젯도 라이트로 고정 */

            /* 배경 메시를 구성하는 파스텔 */
            --mesh-1: #ffd9c4;                 /* 따뜻한 살구 */
            --mesh-2: #c9e0ff;                 /* 맑은 하늘 */
            --mesh-3: #d6f5e3;                 /* 연한 민트 */
            --mesh-4: #efdcff;                 /* 옅은 라벤더 */
            --canvas:  #f4f7fb;                /* 바탕 */

            /* 유리 표면 */
            --glass:        rgba(255, 255, 255, 0.58);
            --glass-strong: rgba(255, 255, 255, 0.78);
            --glass-soft:   rgba(255, 255, 255, 0.38);
            --stroke:       rgba(255, 255, 255, 0.85);
            --stroke-soft:  rgba(17, 24, 39, 0.07);
            --blur: saturate(180%) blur(22px);

            /* 잉크(글자) */
            --ink:   #14161d;
            --ink-2: #454a58;
            --ink-3: #7b8194;
            --ink-4: #a4aab8;

            /* 강조색 */
            --accent:    #ff6a3d;              /* 필름 오렌지 */
            --accent-2:  #4a7dff;              /* 시안 블루 */
            --accent-3:  #12b981;              /* 그린 */
            --danger:    #ef4444;

            /* 그림자 — 유리의 부유감을 만드는 핵심 */
            --shadow-sm: 0 2px 8px rgba(23, 31, 56, 0.06);
            --shadow:    0 10px 30px rgba(23, 31, 56, 0.10), 0 2px 6px rgba(23, 31, 56, 0.04);
            --shadow-lg: 0 24px 60px rgba(23, 31, 56, 0.16), 0 4px 12px rgba(23, 31, 56, 0.06);

            --r-sm: 12px;
            --r:    18px;
            --r-lg: 26px;

            /* 노치·홈바 안전영역 */
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        html {
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;    /* iOS 가로모드 글자 확대 방지 */
            scroll-behavior: smooth;
        }

        body {
            font-family: &#x27;DM Sans&#x27;, -apple-system, BlinkMacSystemFont,
                         &#x27;Pretendard&#x27;, &#x27;Apple SD Gothic Neo&#x27;, &#x27;Noto Sans KR&#x27;,
                         system-ui, sans-serif;
            background: var(--canvas);
            color: var(--ink);
            min-height: 100dvh;
            overflow-x: hidden;
            position: relative;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;   /* 탭 시 파란 사각형 제거 */
            padding: calc(16px + var(--sat)) calc(14px + var(--sar))
                     calc(16px + var(--sab)) calc(14px + var(--sal));
        }

        /* 메시 그라데이션 배경 — 고정 레이어라 스크롤해도 따라오지 않는다 */
        body::before {
            content: &#x27;&#x27;;
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(70vw 60vh at 4% -8%,   var(--mesh-1) 0%, transparent 62%),
                radial-gradient(65vw 55vh at 104% 2%,  var(--mesh-2) 0%, transparent 58%),
                radial-gradient(80vw 60vh at 50% 108%, var(--mesh-3) 0%, transparent 62%),
                radial-gradient(60vw 50vh at 96% 96%,  var(--mesh-4) 0%, transparent 58%),
                linear-gradient(175deg, #fbfcfe 0%, var(--canvas) 100%);
        }

        /* 아주 옅은 필름 그레인 텍스처 — 유리 표면에 촉감을 준다 */
        body::after {
            content: &#x27;&#x27;;
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.035;
            background-image: url(&quot;data:image/svg+xml,%3Csvg viewBox=&#x27;0 0 256 256&#x27; xmlns=&#x27;http://www.w3.org/2000/svg&#x27;%3E%3Cfilter id=&#x27;n&#x27;%3E%3CfeTurbulence type=&#x27;fractalNoise&#x27; baseFrequency=&#x27;0.85&#x27; numOctaves=&#x27;4&#x27; stitchTiles=&#x27;stitch&#x27;/%3E%3C/filter%3E%3Crect width=&#x27;100%25&#x27; height=&#x27;100%25&#x27; filter=&#x27;url(%23n)&#x27;/%3E%3C/svg%3E&quot;);
        }

        .app {
            position: relative;
            max-width: 1560px;
            margin: 0 auto;
            z-index: 1;
        }

        /* ── 유리 카드 공통 ────────────────────────────────────────────────── */
        .glass {
            background: var(--glass);
            -webkit-backdrop-filter: var(--blur);
            backdrop-filter: var(--blur);
            border: 1px solid var(--stroke);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        /* 상단 하이라이트 — 유리 모서리에 빛이 걸린 느낌 */
        .glass::before {
            content: &#x27;&#x27;;
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(160deg,
                        rgba(255, 255, 255, 0.55) 0%,
                        rgba(255, 255, 255, 0) 38%);
        }

        /* backdrop-filter 미지원 브라우저에서는 불투명도를 높여 가독성 확보 */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .glass, .eula-modal, .status-toast, .progress-message { background: rgba(255, 255, 255, 0.94); }
        }

        /* ── 헤더 ───────────────────────────────────────────────────────────── */
        .header {
            text-align: center;
            padding: 22px 16px 24px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-family: &#x27;Playfair Display&#x27;, &#x27;DM Sans&#x27;, serif;
            font-size: clamp(1.75rem, 7vw, 3.1rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            line-height: 1.15;
            background: linear-gradient(115deg, #ff6a3d 0%, #b8479a 42%, #4a7dff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: var(--accent);              /* 그라데이션 미지원 시 폴백 */
        }

        .header .creator {
            margin-top: 8px;
            display: inline-block;
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 0.78rem;
            letter-spacing: 0.02em;
            color: var(--ink-2);
            background: var(--glass-strong);
            -webkit-backdrop-filter: var(--blur);
            backdrop-filter: var(--blur);
            border: 1px solid var(--stroke);
            box-shadow: var(--shadow-sm);
        }

        .header .creator strong { color: var(--ink); }

        .header p {
            margin-top: 10px;
            color: var(--ink-3);
            font-size: clamp(0.86rem, 3.4vw, 1rem);
        }

        /* ── 레이아웃 ───────────────────────────────────────────────────────── */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;        /* 모바일: 한 줄 */
            gap: 14px;
        }

        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-width: 0;
        }

        .control-card {
            padding: 18px 16px;
        }

        .control-card h3 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--ink);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-card h3 span {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--ink-3);
            background: rgba(17, 24, 39, 0.05);
            padding: 2px 8px;
            border-radius: 999px;
        }

        /* ── 미리보기 ───────────────────────────────────────────────────────── */
        .preview-panel {
            order: -1;                          /* 모바일: 컨트롤보다 위 */
            position: sticky;
            top: calc(6px + var(--sat));        /* 스크롤해도 사진이 계속 보이게 */
            z-index: 30;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--glass-strong);
        }

        .preview-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 4px;
            border-radius: 999px;
            background: rgba(17, 24, 39, 0.05);
        }

        .preview-tab {
            appearance: none;
            border: 0;
            background: transparent;
            border-radius: 999px;
            padding: 10px 8px;
            min-height: 42px;
            font: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--ink-3);
            cursor: pointer;
            transition: color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .preview-tab.active {
            color: var(--ink);
            background: #fff;
            box-shadow: var(--shadow-sm);
        }

        .preview-content {
            flex: 1;
            min-height: 150px;
            max-height: 38vh;                   /* 모바일에서 화면을 다 먹지 않도록 */
            border-radius: var(--r);
            background:
                linear-gradient(45deg, rgba(17,24,39,0.035) 25%, transparent 25%) 0 0/16px 16px,
                linear-gradient(-45deg, rgba(17,24,39,0.035) 25%, transparent 25%) 0 8px/16px 16px,
                rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .preview-content img {
            max-width: 100%;
            max-height: 38vh;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(23, 31, 56, 0.14);
        }

        .empty-preview {
            text-align: center;
            color: var(--ink-4);
            padding: 28px 18px;
        }

        .empty-preview svg {
            width: 44px;
            height: 44px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* JS가 안내 문구를 지우고 &lt;img&gt;를 넣으면 빈 상태용 여백을 걷어낸다.
           (JS가 display:block을 인라인으로 지정하므로 margin auto로 가운데 정렬) */
        .empty-preview:has(img) { padding: 0; width: 100%; }
        .empty-preview img { margin: 0 auto; }

        /* ── 업로드 존 ──────────────────────────────────────────────────────── */
        .upload-zone {
            border: 2px dashed rgba(74, 125, 255, 0.35);
            border-radius: var(--r);
            padding: 26px 16px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.45);
            transition: border-color 0.2s, background 0.2s, transform 0.15s;
            min-height: 128px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .upload-zone:active { transform: scale(0.985); }

        .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(255, 106, 61, 0.09);
        }

        .upload-icon { font-size: 2rem; margin-bottom: 8px; }

        .upload-text {
            font-weight: 700;
            font-size: 0.98rem;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .upload-hint { font-size: 0.78rem; color: var(--ink-3); }

        /* ── 필름 선택 ──────────────────────────────────────────────────────── */
        .film-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
            gap: 8px;
        }

        .film-option {
            padding: 12px 10px;
            min-height: 66px;
            border-radius: var(--r-sm);
            background: rgba(255, 255, 255, 0.55);
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .film-option:active { transform: scale(0.97); }

        .film-option.selected {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(255, 106, 61, 0.14), rgba(255, 255, 255, 0.7));
            box-shadow: 0 6px 18px rgba(255, 106, 61, 0.22);
        }

        .film-name {
            font-size: 0.84rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.3;
        }

        .film-desc {
            font-size: 0.72rem;
            color: var(--ink-3);
            margin-top: 3px;
        }

        /* ── 필름 특성 패널 ─────────────────────────────────────────────────── */
        .film-info { font-size: 0.85rem; }

        .fi-title {
            font-size: 1.02rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: var(--ink);
        }

        .fi-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }

        .fi-tag {
            font-size: 0.71rem;
            font-weight: 600;
            padding: 4px 9px;
            border-radius: 999px;
            color: var(--accent-2);
            background: rgba(74, 125, 255, 0.11);
            border: 1px solid rgba(74, 125, 255, 0.18);
            white-space: nowrap;
        }

        .fi-note {
            color: var(--ink-2);
            line-height: 1.65;
            font-size: 0.83rem;
            padding: 12px;
            border-radius: var(--r-sm);
            background: rgba(255, 255, 255, 0.55);
            border-left: 3px solid var(--accent);
        }

        .fi-specs {
            margin-top: 12px;
            display: grid;
            grid-template-columns: auto 1fr;    /* 라벨 | 값 */
            gap: 0;
            border-radius: var(--r-sm);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--stroke-soft);
        }

        .fi-specs dt {
            padding: 8px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--ink-3);
            border-top: 1px solid var(--stroke-soft);
            white-space: nowrap;
        }

        .fi-specs dd {
            padding: 8px 10px;
            font-size: 0.78rem;
            color: var(--ink);
            border-top: 1px solid var(--stroke-soft);
            font-variant-numeric: tabular-nums;
            word-break: keep-all;
        }

        .fi-specs dt:first-of-type, .fi-specs dd:first-of-type { border-top: 0; }

        /* ── 슬라이더 ───────────────────────────────────────────────────────── */
        .slider-control { margin-bottom: 4px; }

      let values = background.match(/[\d.]+/g)?.map(Number);
      if (!values || (values.length > 3 && values[3] < .9)) {
        background = page.defaultView.getComputedStyle(page.documentElement).backgroundColor;
        values = background.match(/[\d.]+/g)?.map(Number);
      }
      if (!values || (values.length > 3 && values[3] < .9)) {
        const ink = style.color.match(/[\d.]+/g)?.map(Number) || [240,240,240];
        values = (ink[0]+ink[1]+ink[2])/3 > 140 ? [24,24,24] : [245,245,245];
        background = 'rgb(' + values.join(',') + ')';
      }
      const light = .2126*values[0]+.7152*values[1]+.0722*values[2] > 140;
      glass.dataset.surface = light ? 'light' : 'dark';
      applyGlassMaterial(glass, (.2126 * values[0] + .7152 * values[1] + .0722 * values[2]) / 255, light);
      const surface = root.host || doc.body;
      surface.style.setProperty('--app-ui-background', background);
      const ui = doc.importNode(page.documentElement, true);
      ui.querySelectorAll('script,iframe,object,embed,meta,base').forEach(node => node.remove());
      for (const element of ui.querySelectorAll('*')) {
        for (const attribute of [...element.attributes]) if (/^on/i.test(attribute.name)) element.removeAttribute(attribute.name);
      }
      for (const style of ui.querySelectorAll('style')) style.textContent = style.textContent.replace(/:root\b/g, 'html');

      uiRoot.replaceChildren(ui);

  }
  backdrop.addEventListener('load', copyStaticUI);
  copyStaticUI();
  if ('ResizeObserver' in window) new ResizeObserver(schedule).observe(glass);
  addEventListener('resize', schedule, {passive: true});
  addEventListener('scroll', schedule, {passive: true, capture: true});
  root.host?.addEventListener('scroll', schedule, {passive: true});
  schedule();
}

async function readStaticUIFromCache(scopeURL) {
  if (typeof caches === 'undefined') return '';
  const marker = ':' + encodeURIComponent(scopeURL) + ':';
  const uiURL = new URL('./pwa-ui.html', scopeURL).href;
  const names = (await caches.keys()).filter(name => name.startsWith('velvitty-pwa:') && name.includes(marker) && name.endsWith(':shell')).reverse();
  for (const cacheName of names) {
    const response = await caches.match(uiURL, {cacheName});
    if (response?.ok) {
      const html = await response.text();
      if (html.trim()) return html;
    }
  }
  return '';
}

function applyGlassMaterial(glass, brightness, light) {
  const middleTone = 1 - Math.abs(brightness * 2 - 1);
  glass.style.setProperty('--glass-alpha', (.055 + .075 * middleTone).toFixed(3));
  glass.style.setProperty('--glass-rgb', light ? '255 255 255' : '12 12 12');
  glass.style.setProperty('--glass-shadow-opacity', (.42 - .16 * brightness).toFixed(3));
}
